# The repo's guardrail (ADR-0050): the same `bun loop check` the strategy loop runs after every slice.
name: check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: northline
          POSTGRES_DB: northline
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the parity and state checks diff against origin/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/loop/go.mod
          cache-dependency-path: tools/loop/go.mod
      - run: bun install --frozen-lockfile
      - run: bun loop check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-evidence
          path: docs/strategy/loop/evidence/
          retention-days: 14
